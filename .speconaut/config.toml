# Namespace generated PHPUnit test stubs (tests/generated/) declare. Matches
# the namespace the committed tree already uses — `Mlavrinenko\Paogen\Tests\
# Generated`, the same vendor prefix as src/'s own PSR-4 root
# (`Mlavrinenko\Paogen\`) — so this states what the files already say rather
# than introducing a new convention. `generate-tests` no longer takes
# `--namespace` as a CLI flag; the adapter reads it from here instead.
# Single-quoted TOML literal string on purpose: a PHP namespace is
# backslash-separated, and a double-quoted TOML string treats backslash as
# an escape, which would silently mangle it.
namespace = 'Mlavrinenko\Paogen\Tests\Generated'

# paogen declined the speconaut session workflow: no `speconaut session
# start`/`close`, no installed pre-commit hook driving it, tasks go
# proposed -> wip -> done by hand through mindtape instead. `enabled = false`
# says that was a choice, not neglect, so `check`/`status` stop treating
# every `done` task's missing session block as a bypassed lifecycle —
# without it, all 31 `done`/`cancelled` tasks in truth/tasks/ produced a
# `task lifecycle provenance` warning apiece (verified: zero after this
# line, see `declare-paogen-runs-no-sessions`). It also reaches `lock`, which
# used to demand an open session regardless and now runs as a plain lockfile
# primitive here: the FSM ordering check and the spec-first diff baseline are
# both session-shaped, so for a project that never opens one they are
# undefined rather than skipped. The `git-hook pre-commit` spec-first pairing
# still applies — the staged set is a baseline it can judge without a session.
# Fixed upstream 2026-07-31 as `session-opt-out-does-not-reach-lock`; an
# earlier version of this comment said the opposite and was right when
# written. Revisit if paogen ever
# wants the workflow-runtime session protocol's other benefits (in-process
# spec-first gate on `lock`, orientation dumps via `session start`) enough
# to also install the hook and start opening/closing sessions per task —
# until then, the provenance check has nothing true to assert.
[session]
enabled = false

# `lock`/`status`/`diff` spawn an adapter to resolve traces; unset, the
# adapter name falls through to speconaut's baked-in default, `rust`, which
# paogen — a PHP project — never satisfies:
#
#   error: failed to resolve traces via TraceProvider: failed to load
#   manifest for rpc audit-traces against .../speconaut-rust: read manifest
#   tests/generated/manifest.json: No such file or directory
#
# Naming the real adapter fixes that failure. The two paragraphs this
# comment used to carry after it — that `tests/generated/` had no
# `manifest.json` because these recipes had never really run, and that the
# adapter's missing-manifest error was the open precondition — are stale as
# of `restore-coverage-derived-traceability` (2026-08-02): `generate-tests`
# has run for real, `tests/generated/manifest.json` is committed (verified:
# `ls tests/generated/` shows it alongside the `*Test.php`/`*Steps.php`
# files), and `speconaut audit-traces --adapter php-phpunit` gets past
# manifest resolution to `96 scenario(s) checked`.
#
# What blocks it now is upstream, in the adapter itself, not in this repo:
# `AuditTracesHandler` hardcodes the PHPUnit `--filter` namespace to
# `Speconaut\Generated` and the RPC envelope carries no `namespace` field to
# override it with — unlike `generate-tests`, which reads `namespace` above
# and got exactly this fix in `carry-the-consumer-namespace-through-the-rpc-
# envelope` (2026-07-31). Every one of the 96 scenarios therefore fails
# identically with "phpunit exited with code 1" (verified by reproducing the
# collector's own PHPUnit invocation by hand: `--filter
# '/^Speconaut\\Generated\\...'` against a class actually declaring
# `Mlavrinenko\Paogen\Tests\Generated` reports "No tests executed!" and exits
# 1; the same invocation with the real namespace passes). Filed upstream as
# `audit-traces-ignores-the-configured-namespace` in speconaut's own
# `truth/tasks/` — this repo cannot work around it, since the namespace used
# to build the filter never reaches the RPC params at all.
[audit-traces]
adapter = "php-phpunit"

# `[audit-traces]` reads its own `source-roots` key — independent of
# `[check].source-roots` below despite the identical name — and defaults to
# `["src"]` alone when unset (`speconaut`'s `AuditTracesConfig::default()`).
# Left unset, every `runtime/src/*.php` and `bin/*.php` file the coverage
# collector reports gets silently dropped by the host's source-root filter
# before it ever reaches the trace map or plumbing classification: measured
# by running the collector against a locally-patched adapter with the
# namespace bug above worked around — 96 scenarios produced zero
# `runtime/src` files anywhere in the report even though a single scenario's
# raw Clover output plainly covers `runtime/src/Attribute/Discriminator.php`
# and others. Matching `[check].source-roots` here restores them.
source-roots = ["src", "runtime/src", "bin"]

[check]

# Roots the untraced-source finding walks.
source-roots = ["src", "runtime/src", "bin"]

# Behavioural specs live here. The spec-first gate treats a change under a
# source root as needing a paired change under one of these.
spec-roots = ["truth/specs"]

# The code-ref sweep forbids file paths, member chains, and call shapes in
# specs, decisions, standards, and domain artifacts, so those layers stay
# portable across reimplementations. paogen exempts the output vocabulary
# alone; it used to also exempt debt pointing at paogen's own tree.
#
# The call shapes and attribute forms are legitimate. paogen's product IS
# emitted PHP, so `addPet(Pet $body): Pet` and `#[BindsFormat('date-time')]`
# are the observable behaviour a scenario asserts, not an implementation leak.
# Rephrasing them behaviourally would describe the generator by describing
# nothing.
#
# `src/`, `bin/`, and `tests/` paths were exempted here too, as debt: 32
# references (measured directly with a grep sweep, not estimated) pointed at
# paogen's own tree across truth/specs/ and truth/decisions/, none under
# truth/standards/ or truth/domain/. An earlier pass had claimed 140 —
# wrong, and likely a conflation with truth/tasks/, which separately carries
# 258 such references and stays exempt by design, since tasks are the
# implementation bridge and are meant to name files. `narrow-the-code-ref-
# exemption` rewrote the 32 behaviourally and dropped the debt entries below.
[check.code-refs]
source-extensions = []
allowlist = [
  # Output vocabulary: emitted signatures, attributes, member references.
  "(",
  "::",
]

# Required L2 sections on decisions and standards. This restates, on purpose,
# exactly what speconaut already enforces when `[check.headers]` is absent —
# a decision needs Context / Choice / Consequences in that order, a standard
# is slot-only DSL and takes no L2 headers. Writing the baked-in default out
# explicitly means a future speconaut release changing that default cannot
# silently loosen or tighten what paogen's own decisions and standards owe a
# reader; the shape is a content contract this project chose, not an
# accident of whatever speconaut ships. Confirmed a no-op against the current
# tree: 15 decisions, 15 `== Context`/`== Choice`/`== Consequences`, in order.
[check.headers]
enforce-order = true

[[check.headers.decision.sections]]
name = "Context"
required = true

[[check.headers.decision.sections]]
name = "Choice"
required = true

[[check.headers.decision.sections]]
name = "Consequences"
required = true

# Stale `stage: review` scenarios. paogen writes none yet, so this is inert
# on data today regardless of the window — but the window is worth setting
# now rather than inheriting speconaut's default un-examined. The default
# (50 commits) is calibrated to nothing paogen-specific; this repo ships in
# short task branches (observed ~4-8 commits each, `git log --oneline
# --merges`) and lands 20-40 commits a day while a session is active, so 50
# commits is closer to a day and a half of unrelated churn before a
# forgotten review scenario would get a nudge. 30 commits — roughly one
# day at the pace this repo actually moves — is the tighter, still-honest
# number.
[check.orphan-review]
window-commits = 30

# `[check.context-deps]` is declined this round, not because it doesn't fit
# paogen — it fits exactly: four real bounded contexts (schema, generation,
# guidance, cli) with a real dependency shape worth enforcing. It is declined
# because turning it on today produces 12 findings, and 9 of them sit in
# truth/standards/, which another agent is actively editing under this same
# milestone; this task's boundary is to fix findings in truth/decisions/ and
# defer everything else rather than paper over it with a shared-kernel or
# allow-list that nobody has actually decided is correct policy. Naming both
# groups so neither has to be re-derived:
#
# Fixable now, in truth/decisions/ (this task's own remit, left alone only
# because the check as a whole can't ship green yet):
#   - operations-delegate-to-an-injected-transport.decision-260730.typ
#     (generation) -> schema — references #the(Schema) in prose without
#     declaring schema-context an owner.
#   - xml-request-bodies-are-serialised-not-refused.decision-260730.typ
#     (generation) -> guidance, -> schema — references #the(Schema) and
#     #a(Profile) without declaring either as an owning context.
#   Likely fix: widen `contexts:` the way
#   attribute-and-phpdoc-driven-serialization.decision-260420.typ already
#   does for a two-context decision, rather than adding narrow allow-edges.
#
# Blocking, in truth/standards/ (out of bounds for this task):
#   - caller-surface-is-injectable.standard-260729.typ (generation) -> schema
#   - fixtures-are-unmodified-vendor-documents.standard-260729.typ (schema)
#     -> guidance
#   - generated-types-are-total.standard-260729.typ (generation) -> guidance,
#     -> schema
#   - guidance-is-data-not-code.standard-260729.typ (guidance) -> generation
#   - regeneration-is-deterministic-and-total.standard-260729.typ
#     (generation) -> guidance, -> schema
#   - silence-means-success.standard-260729.typ (cli, generation) ->
#     guidance, -> schema
#
# Revisit once the standards sweep lands: fix the two decisions above, then
# either widen the standards' `contexts:` the same way or add
# `[[check.context-deps.allow]]` edges — that choice belongs to whoever is
# already reasoning about those files' ownership, not to this config change.

# `[status.staleness]` is declined. The heuristic flags a non-terminal task as
# `may-be-stale` only when the task's own `contexts:` (an `x-speconaut`
# extras slot, separate from decisions'/standards' `contexts:`) intersects an
# accepted decision or terminal task that landed after the task's staleness
# floor. Checked: 0 of paogen's 77 task files carry `x-speconaut.contexts`.
# With no task tagged, every task is exempt and the heuristic can never fire
# — any `days` value here would be undetectable policy, not a real decision.
# It costs nothing to leave unset: the moment a task starts tagging
# `x-speconaut.contexts`, speconaut's baked-in default (14 days) applies
# automatically. Revisit once task-level context tagging exists to pick a
# number against — that tagging is out of this task's file boundary
# (truth/tasks/*.typ content belongs elsewhere).
#
# `[tasks]` (max-estimate-hours / over-budget-is-error) is declined, and not
# provisionally — paogen's own .mindtape/config.toml already rejects
# hour-based sizing as a matter of policy: "Priority stays a plain optional
# integer... Requiring a score would buy a number the agent invented to
# satisfy the field... Difficulty is the exception, because it is the
# routing question... Score JUDGMENT REQUIRED, not size." paogen sizes tasks
# by `difficulty` (a 0-9 judgment rubric), not by an `estimate: (hours:
# ...)` slot. Checked: 0 of 77 task files set `estimate:` at all. Adding a
# `max-estimate-hours` budget would regulate a field this project has
# already decided, in writing, not to populate — it would sit permanently
# inert at best, and at worst invite an agent to invent an hours figure just
# to satisfy the config surface, which is exactly the failure mode the
# mindtape preset's own comments warn against.

# How many task-referencing commits `speconaut context` / `speconaut next
# --full` surface under "recent activity". The default (5) is a generic
# number; paogen's task branches run ~4-8 commits end to end (feature commit,
# tests, docs, a status-flip commit, sometimes a merge — see `git log
# --oneline --merges`), so 5 can truncate a single branch's own history
# mid-task. 8 covers a typical branch in full without ballooning the dump.
[orientation]
recent-commits = 8

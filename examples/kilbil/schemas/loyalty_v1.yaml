  /load/processsale:
    post:
      operationId: processsale
      summary: Рассчитать документ
      description: Расчет и создание не подтвержденного документа в лояльности, возвращает
        рассчитанный документ из лояльности для применения механики лояльности к документу
      tags:
      - Операции
      requestBody:
        content:
          application/json:
            schema:
              required:
              - client_id
              - type
              - bonus_out
              - max_bonus_out
              - goods_data
              - move_id
              - doc_open_dt
              type: object
              properties:
                client_id:
                  type:
                  - integer
                  - 'null'
                  format: int
                  description: id клиента, null если документ без клиента
                  example: 4004565
                type:
                  type: integer
                  format: int
                  enum:
                  - 0
                  - 1
                  description: "тип операции \n\n- 0 - продажа\n- 1 - возврат\n"
                  example: 0
                bonus_out:
                  type: number
                  format: double
                  description: количество списанных бонусов в операции
                  example: 100
                max_bonus_out:
                  type: number
                  format: double
                  description: максимально возможная сумма списания бонусов без учета
                    баланса клиента (передается значение выходного параметра max_bill_bonus_out
                    функции searchclient)
                  example: 191.47
                goods_data:
                  type: array
                  description: массив объектов с позициями номенклатуры
                  items:
                    required:
                    - code
                    - vendor_code
                    - name
                    - price
                    - quantity
                    - total
                    - discounted_price
                    - discounted_total
                    type: object
                    properties:
                      code:
                        type: string
                        description: код, по которому может проходить поиск номенклатуры
                          (в зависимости от настроек типа поиска номенклатуры в настройках
                          лояльности)
                      barcode:
                        type: string
                        description: штрихкод номенклатуры
                      vendor_code:
                        type: string
                        description: артикул (SKU), по которому может проходить поиск
                          номенклатуры (в зависимости от настроек типа поиска номенклатуры
                          в настройках лояльности)
                      name:
                        type: string
                        description: наименование номенклатуры
                      variant:
                        type: string
                        description: наименование варианта номенклатуры (характеристика)
                      price:
                        type: number
                        format: double
                        description: цена без скидки за единицу номенклатуры
                      quantity:
                        type: number
                        format: double
                        description: количество номенклатуры в позиции
                      total:
                        type: number
                        format: double
                        description: сумма без скидки за позицию номенклатуры
                      minPrice:
                        type: number
                        format: double
                        description: ограничение по минимальной цене номенклатуры
                          за единицу, при расчете в лояльности цена со скидкой никогда
                          не будет ниже переданной цены в этом параметре
                      maxDiscount:
                        type: number
                        format: double
                        minimum: 0
                        maximum: 100
                        description: ограничение по максимальной скидки номенклатуры
                          в процентах, при расчете в лояльности скидка никогда не
                          будет больше переданного процента в этом параметре
                      discounted_price:
                        type: number
                        format: double
                        description: цена со скидкой со стороны кассы или интернет
                          магазина за единицу номенклатуры
                      discounted_total:
                        type: number
                        format: double
                        description: сумма со скидкой со стороны кассы или интернет
                          магазина за позицию
                      parent_code:
                        type: string
                        description: код группы номенклатуры
                      parent_vendor_code:
                        type: string
                        description: артикул (SKU) группы номенклатуры
                      good_promo:
                        type: array
                        description: массив промокодов на позицию
                        items:
                          type: string
                          description: промокод применяемый на позицию
                      flags:
                        type: integer
                        format: int
                        description: передается только если был сначала предварительный
                          расчет в **processsale** или в **searchclient** с параметрам
                          **pos_discounts_are_used**, значение берётся с одноименного
                          параметра, флаг информирования кассира об изменении цены
                      new_price_action_id:
                        type:
                        - integer
                        - 'null'
                        format: int
                        description: передается только если был сначала предварительный
                          расчет в **processsale** или в **searchclient** с параметрам
                          **pos_discounts_are_used**, значение берётся с одноименного
                          параметра, id акции в лояльности
                      new_price_respond_id:
                        type:
                        - integer
                        - 'null'
                        format: int
                        description: передается только если был сначала предварительный
                          расчет в **processsale** или в **searchclient** с параметрам
                          **pos_discounts_are_used**, значение берётся с одноименного
                          параметра, id действия акции в лояльности
                      new_price_limit_action_id:
                        type:
                        - integer
                        - 'null'
                        format: int
                        description: передается только если был сначала предварительный
                          расчет в **processsale** или в **searchclient** с параметрам
                          **pos_discounts_are_used**, значение берётся с одноименного
                          параметра, id акции ограничения в лояльности
                      new_price_limit_respond_id:
                        type:
                        - integer
                        - 'null'
                        format: int
                        description: передается только если был сначала предварительный
                          расчет в **processsale** или в **searchclient** с параметрам
                          **pos_discounts_are_used**, значение берётся с одноименного
                          параметра, id действия акции по ограничению в лояльности
                      new_price_limits_counter_quantity:
                        type:
                        - integer
                        - 'null'
                        format: int
                        description: передается только если был сначала предварительный
                          расчет в **processsale** или в **searchclient** с параметрам
                          **pos_discounts_are_used**, значение берётся с одноименного
                          параметра, остаток для накопления сработки акции
                  example:
                  - code: '2137'
                    barcode: '2400000005926'
                    vendor_code: '2137'
                    name: Товар 1
                    variant: Синий, 39
                    price: 130
                    quantity: 2
                    total: 260
                    minPrice: 0
                    maxDiscount: 100
                    discounted_price: 129.99
                    discounted_total: 259.98
                    parent_code: '2082'
                    parent_vendor_code: ''
                    good_promo: [
                      'mrk6709876', 
                      'sale10'
                    ]
                  - code: '3957'
                    barcode: '4870001723859'
                    vendor_code: '3957'
                    name: Товар 2
                    price: 68.32
                    quantity: 1
                    total: 68.32
                    minPrice: 0
                    maxDiscount: 100
                    discounted_price: 68.32
                    discounted_total: 68.32
                    parent_code: '4085'
                    parent_vendor_code: ''
                move_id:
                  type: string
                  description: номер операции, присланный с кассы, не меньше 4х символов,
                    должен быть уникален в рамках торгового оборудования, null если
                    нет
                  example: frl-050422-180306-79365
                doc_open_dt:
                  type: string
                  format: date time
                  description: дата и время открытия документа
                  example: 09.11.2020 17:27:35
                return_move_id:
                  type: string
                  description: номер документа торгового оборудования, по которому
                    производится возврат (передаётся только для возвратов)
                  example: null
                return_doc_dt:
                  type: string
                  description: дата и время документа торгового оборудования, по которому
                    производится возврат
                  example: null
                is_offline:
                  type: boolean
                  default: false
                  description: 'отправлена ли продажа оффлайн-службой


                    - true - да

                    - false - нет

                    '
                  example: false
                promo_codes:
                  type: object
                  description: промокод, лояльность в данный момент работает только
                    с одним промокодом на документ
                  properties:
                    coupons:
                      type: array
                      description: массив объектов с промокодами
                      items:
                        type: object
                        properties:
                          coupon:
                            type: string
                            description: промокод применяемый на документ
                            example: promo2022
                card_apply_dt:
                  type: string
                  format: date time
                  description: Дата и время применения карты (в часовом поясе UTC,
                    т.е. без сдвига по часовым поясам), необходимый параметр для поиска
                    по временной карте клиента
                  example: 09.11.2020 17:28:23
                shift_number:
                  type: integer
                  format: int
                  description: номер смены операции
                  example: 552
                client_search_mode:
                  type: integer
                  format: int
                  enum:
                  - 0
                  - 1
                  - 2
                  - 3
                  description: 'режим поиска, параметр нужен для определения клиента
                    в при передачи чека в offline режиме


                    - 0 – поиск по № телефона

                    - 1 – поиск по внутреннему № карты

                    - 2 – поиск по № карты

                    - 3 - поиск по id клиента

                    '
                  example: 0
                client_search_value:
                  type: string
                  description: значение, по которому производится поиск, если по номеру
                    телефона, это должно быть 11 символов первая 7-ка, параметр нужен
                    для определения клиента в при передачи чека в offline
                  example: '79129999999'
                is_reserved:
                  type: boolean
                  default: false
                  description: функция резервирования не подтвержденного документа,
                    актуально для интернет магазинов. Позволяет зарезервировать списание
                    бонусов, акции (акция сработает если вышел срок действия на текущий
                    момент, но на момент резервирования акция работала)
                  example: false
                pos_discounts_are_used:
                  type: integer
                  format: int
                  enum:
                  - 0
                  - 1
                  default: 0
                  description: отправляется только если применяются скидки кассы на
                    документ, используется для предварительного расчета по акциям
                    на применение цены, если на кассе используются внутренние скидки,
                    так как внутренняя скидка кассы может изменится после применения
                    цены делается промежуточный расчет
                  example: 0
      responses:
        '200':
          description: Описание возвращаемого результата
          content:
            application/json:
              schema:
                required:
                - result_code
                - result_text
                - _bill_data
                - _bill_body
                - _bill_header
                - _bill_footer
                type: object
                properties:
                  result_code:
                    type:
                    - string
                    - integer
                    format: int
                    description: код результата, где 0 - успешно
                    example: '0'
                  result_text:
                    type: string
                    description: текст описания результата
                    example: Чек обработан
                  _bill_data:
                    required:
                    - items
                    - total
                    - bonus_in
                    - discount
                    - bonus_out
                    - discounted_total
                    type: object
                    description: информация по расчету документа
                    properties:
                      items:
                        type: array
                        description: массив объектов с позициями номенклатуры
                        items:
                          required:
                          - code
                          - flags
                          - price
                          - total
                          - bonus_in
                          - discount
                          - quantity
                          - rounding
                          - bonus_out
                          - bonus_out_money
                          - client_discount
                          - discounted_price
                          - discounted_total
                          type: object
                          properties:
                            code:
                              type: string
                              description: код номенклатуры загруженный с товароучетной
                                программы
                            flags:
                              type: integer
                              format: int
                              description: флаг информирования кассира об изменении
                                цены (информация теперь автоматом будет добавляться
                                в cashier_messages)
                            price:
                              type: number
                              format: double
                              description: цена номенклатуры
                            total:
                              type: number
                              format: double
                              description: сумма позиции
                            bonus_in:
                              type: number
                              format: double
                              description: количество начисленных бонусов за позицию
                            discount:
                              type: number
                              format: double
                              description: размер скидки, примененный на позицию номенклатуры
                            quantity:
                              type: number
                              format: double
                              description: количество номенклатуры в позиции
                            rounding:
                              type: number
                              format: double
                              description: округление позиции в лояльности
                            bonus_out:
                              type: number
                              format: double
                              description: количество списанных бонусов на позицию
                            bonus_out_money:
                              type: number
                              format: double
                              description: количество списанных бонусов на позицию
                                в рублях (для расчета брать этот параметр, он будет
                                показывать списание в рублях с учетом множителей)
                            client_discount:
                              type:
                              - number
                              - 'null'
                              format: double
                              description: сумма скидки кассы или интернет магазина
                                на позицию
                            discounted_price:
                              type: number
                              format: double
                              description: цена номенклатуры с учетом скидок и списания
                                бонусов
                            discounted_total:
                              type: number
                              format: double
                              description: сумма номенклатуры с учетом скидок и списания
                                бонусов
                      total:
                        type: number
                        format: double
                        description: сумма документа
                      bonus_in:
                        type: number
                        format: double
                        description: количество начисленных бонусов за документ
                      discount:
                        type: number
                        format: double
                        description: размер скидки, примененный на документ
                      bonus_out:
                        type: number
                        format: double
                        description: количество списанных бонусов на документ
                      discounted_total:
                        type: number
                        format: double
                        description: сумма документа с учетом скидок и списания бонусов
                    example:
                      items:
                      - code: '2137'
                        flags: 0
                        price: 130
                        total: 130
                        bonus_in: 6.21
                        discount: 0
                        quantity: 1
                        rounding: 0
                        bonus_out: 67.89
                        bonus_out_money: 67.89
                        client_discount: null
                        discounted_price: 62.09
                        discounted_total: 62.09
                      - code: '3957'
                        flags: 0
                        price: 68.32
                        total: 68.32
                        bonus_in: 2.94
                        discount: 6.83
                        quantity: 1
                        rounding: 0
                        bonus_out: 32.11
                        bonus_out_money: 32.11
                        client_discount: null
                        discounted_price: 29.38
                        discounted_total: 29.38
                      total: 198.32
                      bonus_in: 9.15
                      discount: 6.83
                      bonus_out: 100
                      discounted_total: 91.47
                  _bill_body:

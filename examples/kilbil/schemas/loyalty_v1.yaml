                  result_code:
                    type: integer
                    example: 1
                  result_text:
                    type: string
                    example: Доступ запрещен
  /load/confirmsale:
    post:
      operationId: confirmsale
      summary: Подтвердить документ
      description: Подтверждение документа после processsale, после этого в лояльности
        чек считается подтвержденным и участвует в отчетах и происходят все начисления
        и списания бонусов
      tags:
      - Операции
      requestBody:
        content:
          application/json:
            schema:
              required:
              - move_id
              - doc_open_dt
              - doc_dt
              type: object
              properties:
                move_id:
                  type: string
                  description: уникальный номер чека торгового оборудования, длинна
                    не меньше 4 символов (должно совпадать с номером документа processsale)
                  example: '101279'
                doc_open_dt:
                  type: string
                  format: data time
                  description: дата и время открытия документа (должно совпадать с
                    временем открытия processsale)
                  example: 09.11.20 17:27:35
                doc_dt:
                  type: string
                  format: data time
                  description: дата и время закрытия документа
                  example: 09.11.20 17:29:14
                shift_open_dt:
                  type: string
                  format: data time
                  description: дата и время открытия смены
                  example: 09.11.20 08:01:44
                is_offline:
                  type: integer
                  format: int
                  default: 0
                  enum:
                  - 0
                  - 1
                  description: 'отправлено ли подтверждение оффлайн-службой, чек из
                    офлайна не пересчитывается по акциям и записывается как есть


                    - 0 - нет

                    - 1 - да

                    '
                  example: 0
                kkm_serial_number:
                  type: string
                  deprecated: true
                  description: серийный номер фискального накопителя (ФН). Не используется
                  example:
                kkm_doc_number:
                  type: string
                  deprecated: true
                  description: номер фискального документа (ФД). Не используется
                  example:
                kkm_fiscal_sign:
                  type: string
                  deprecated: true
                  description: фискальный признак документа (ФП). Не используется
                  example:
                username:
                  type: string
                  description: ФИО кассира, закрывшего документ
                  example: Кассир
                useruid:
                  type: string
                  description: уникальный id кассира, закрывшего документ
                  example: '1'
                payments:
                  type: array
                  description: массив с оплатами, каждый вид оплаты отдельным объектом
                  items:
                    required:
                    - payment_amount
                    - type
                    type: object
                    properties:
                      payment_amount:
                        type: number
                        format: double
                        description: итоговая сумма по виду оплаты
                        example: 68.3
                      type:
                        type: integer
                        format: int
                        description: "виды оплат в закрытой смене \n\n- 0 - наличные\n\
                          - 1 - банковская карта\n- 2 - сертификат kilbil\n- 3 - пользовательская\
                          \ оплата\n- 99 - другой вид оплаты\n"
                        enum:
                        - 0
                        - 1
                        - 2
                        - 3
                        - 99
                        example: 2
                      gift_card_barcode:
                        type: string
                        description: только для подарочных сертификатов kilbil (вид
                          оплаты 2), нужно передать barcode сертификата, для списания
                          баланса с сертификата
                        example: '300001'
                goods_data:
                  type: array
                  description: массив объектов с позициями номенклатуры, для корректировки
                    сумм позиций, например если после processsale было округление
                    до рубля, что бы суммы не расходились между РМК и лояльностью,
                    следует передавать такой массив. Массив должен быть равен ранее
                    переданному goods_data в processale
                  items:
                    required:
                    - code
                    - quantity
                    - discounted_total
                    type: object
                    properties:
                      code:
                        type: string
                        description: код, по которому может проходить поиск номенклатуры
                          (в зависимости от настроек типа поиска номенклатуры в настройках
                          лояльности)
                        example: '2137'
                      quantity:
                        type: number
                        format: double
                        description: количество номенклатуры в позиции
                        example: 2
                      discounted_total:
                        type: number
                        format: double
                        description: сумма со скидкой со стороны кассы или интернет
                          магазина за позицию
                        example: 259.98
      responses:
        '200':
          description: Описание возвращаемого результата
          content:
            application/json:
              schema:
                required:
                - result_code
                - result_text
                type: object
                properties:
                  result_code:
                    type:
                    - string
                    - integer
                    format: int
                    description: код результата, где 0 - успешно
                    example: '0'
                  result_text:
                    type: string
                    description: текст описания результата
                    example: Удаление завершено
        '403':
          description: 403 Forbidden - доступ запрещен, может содержать тело
          content:
            application/json:
              schema:
                type: object
                properties:
                  result_code:
                    type: integer
                    example: 1
                  result_text:
                    type: string
                    example: Доступ запрещен

openapi: 3.1.0
info:
  version: 1.5.3
  title: Описание kilbil loyalty api v1
  x-logo:
    url: ./image/logo.png
  contact:
    name: Support
    email: support@kilbil.ru
    url: https://kilbil.ru/
  license:
    name: unlicensed
    url: https://kilbil.ru/
  description: "# Общая информация\n\nКаждый запрос с кассы сопровождается apiKey\
    \ - Уникальный идентификатор рабочей станции, который является ключом.\n\nВ дальнейшем\
    \ касса, посылает все запросы с apiKey.\n\nСервис обработки ретранслирует запрос\
    \ в нужную базу данных. \n\nОбращение происходит по адресу https://bonus.kilbil.ru/load/{название_функции}?h={ключ}\n\
    \nТело запроса должно соответствовать формату JSON\n\nСценарии для интеграции\
    \ есть на [странице помощи](https://help.kilbil.ru/163-164--integraciya-s-sajtom-internet-magazinom-i-prilozheniyami-po-api/)\n"
servers:
- url: https://bonus.kilbil.ru
tags:
- name: Клиенты
  description: Работа с данными клиента
- name: Теги
  description: Работа с тегами
- name: Операции
  description: Работа с операциями
- name: Код подтверждения
  description: Работа с проверочными кодами для активации или проверки например списания
    бонусов
- name: Промокоды
  description: Работа с промокодами лояльности
- name: Информация о лояльности
  description: Получение информации о настройках лояльности
- name: Номенклатура
  description: Работа с номенклатурой в лояльности
- name: Подарочные сертификаты
  description: Работа с подарочными сертификатами
- name: Wallet
  description: Работа с картами wallet лояльности
- name: План-факт
  description: Получение информации по разделу план-факт в лояльности
- name: Другое
  description: Специфические методы
paths:
  /load/searchclient:
    post:
      operationId: searchclient
      summary: Поиск клиента
      description: Поиск клиента в лояльности по различным параметрам
      tags:
      - Клиенты
      requestBody:
        content:
          application/json:
            schema: 
              required:
              - search_mode
              - search_value
              type: object
              properties:
                search_mode:
                  type: integer
                  format: int
                  enum:
                  - 0
                  - 1
                  - 2
                  - 3
                  description: "режим поиска \n\n- 0 – поиск по № телефона\n- 1 –\
                    \ поиск по внутреннему № карты\n- 2 – поиск по № карты\n- 3 -\
                    \ поиск по id клиента\n"
                  example: 0
                search_value:
                  type: string
                  description: значение, по которому производится поиск, если по номеру
                    телефона, это должно быть 11 символов первая 7-ка
                  example: '79129999999'
                goods_data:
                  type: array
                  description: массив объектов с позициями номенклатуры
                  items:
                    required:
                    - code
                    - vendor_code
                    - name
                    - price
                    - quantity
                    - total
                    - discounted_price
                    - discounted_total
                    type: object
                    properties:
                      code:
                        type: string
                        description: код, по которому может проходить поиск номенклатуры
                          (в зависимости от настроек типа поиска номенклатуры в настройках
                          лояльности)
                      barcode:
                        type: string
                        description: штрихкод номенклатуры
                      vendor_code:
                        type: string
                        description: артикул (SKU), по которому может проходить поиск
                          номенклатуры (в зависимости от настроек типа поиска номенклатуры
                          в настройках лояльности)
                      name:
                        type: string
                        description: наименование номенклатуры
                      variant:
                        type: string
                        description: наименование варианта номенклатуры (характеристика)
                      price:
                        type: number
                        format: double
                        description: цена без скидки за единицу номенклатуры
                      quantity:
                        type: number
                        format: double
                        description: количество номенклатуры в позиции
                      total:
                        type: number
                        format: double
                        description: сумма без скидки за позицию номенклатуры
                      minPrice:
                        type: number
                        format: double
                        description: ограничение по минимальной цене номенклатуры
                          за единицу, при расчете в лояльности цена со скидкой никогда
                          не будет ниже переданной цены в этом параметре
                      maxDiscount:
                        type: number
                        format: double
                        minimum: 0
                        maximum: 100
                        description: ограничение по максимальной скидки номенклатуры
                          в процентах, при расчете в лояльности скидка никогда не
                          будет больше переданного процента в этом параметре
                      discounted_price:
                        type: number
                        format: double
                        description: цена со скидкой со стороны кассы или интернет
                          магазина за единицу номенклатуры
                      discounted_total:
                        type: number
                        format: double
                        description: сумма со скидкой со стороны кассы или интернет
                          магазина за позицию
                      parent_code:
                        type: string
                        description: код группы номенклатуры
                      parent_vendor_code:
                        type: string
                        description: артикул (SKU) группы номенклатуры
                      good_promo:
                        type: array
                        description: массив промокодов на позицию
                        items:
                          type: string
                          description: промокод применяемый на позицию
                      flags:
                        type: integer
                        format: int
                        description: передается только если был сначала предварительный
                          расчет в **processsale** или в **searchclient** с параметрам
                          **pos_discounts_are_used**, значение берётся с одноименного
                          параметра, флаг информирования кассира об изменении цены
                      new_price_action_id:
                        type:
                        - integer
                        - 'null'
                        format: int
                        description: передается только если был сначала предварительный
                          расчет в **processsale** или в **searchclient** с параметрам
                          **pos_discounts_are_used**, значение берётся с одноименного
                          параметра, id акции в лояльности
                      new_price_respond_id:
                        type:
                        - integer
                        - 'null'
                        format: int
                        description: передается только если был сначала предварительный
                          расчет в **processsale** или в **searchclient** с параметрам
                          **pos_discounts_are_used**, значение берётся с одноименного
                          параметра, id действия акции в лояльности
                      new_price_limit_action_id:
                        type:
                        - integer
                        - 'null'
                        format: int
                        description: передается только если был сначала предварительный
                          расчет в **processsale** или в **searchclient** с параметрам
                          **pos_discounts_are_used**, значение берётся с одноименного
                          параметра, id акции ограничения в лояльности
                      new_price_limit_respond_id:
                        type:
                        - integer
                        - 'null'
                        format: int
                        description: передается только если был сначала предварительный
                          расчет в **processsale** или в **searchclient** с параметрам
                          **pos_discounts_are_used**, значение берётся с одноименного
                          параметра, id действия акции по ограничению в лояльности
                      new_price_limits_counter_quantity:
                        type:
                        - integer
                        - 'null'
                        format: int
                        description: передается только если был сначала предварительный
                          расчет в **processsale** или в **searchclient** с параметрам
                          **pos_discounts_are_used**, значение берётся с одноименного
                          параметра, остаток для накопления сработки акции
                  example:
                  - code: '2137'
                    barcode: '2400000005926'
                    vendor_code: '2137'
                    name: Товар 1
                    variant: Синий, 39
                    price: 130
                    quantity: 2
                    total: 260
                    minPrice: 0
                    maxDiscount: 100
                    discounted_price: 129.99
                    discounted_total: 259.98
                    parent_code: '2082'
                    parent_vendor_code: ''
                    good_promo: [
                      'mrk6709876', 
                      'sale10'
                    ]
                  - code: '3957'
                    barcode: '4870001723859'
                    vendor_code: '3957'
                    name: Товар 2
                    price: 68.32
                    quantity: 1
                    total: 68.32
                    minPrice: 0
                    maxDiscount: 100
                    discounted_price: 68.32
                    discounted_total: 68.32
                    parent_code: '4085'
                    parent_vendor_code: ''
                promo_codes:
                  type: object
                  description: промокод, лояльность в данный момент работает только
                    с одним промокодом на документ
                  properties:
                    coupons:
                      type: array
                      description: массив объектов с промокодами
                      items:
                        type: object
                        properties:
                          coupon:
                            type: string
                            description: промокод применяемый на документ
                            example: promo2022
                card_apply_dt:
                  type: string
                  format: date time
                  description: Дата и время применения карты (в часовом поясе UTC,
                    т.е. без сдвига по часовым поясам), необходимый параметр для поиска
                    по временной карте клиента
                  example: 09.11.2020 17:28:23
                full_data:
                  type: boolean
                  default: false
                  description: передается для получения дополнительной информации
                    по клиенту о всех картах и интерфейсах (например телеграм)
                  example: true
                pos_discounts_are_used:
                  type: integer
                  format: int
                  enum:
                  - 0
                  - 1
                  default: 0
                  description: отправляется только если применяются скидки кассы на
                    документ, используется для предварительного расчета по акциям
                    на применение цены, если на кассе используются внутренние скидки,
                    так как внутренняя скидка кассы может изменится после применения
                    цены делается промежуточный расчет в searchclient или можно так
                    же сделать в processsale
                  example: 1
      responses:
        '200':
          description: Описание возвращаемого результата
          content:
            application/json:
              schema:
                required:
                - result_code
                - result_text
                - client_id
                - state
                - bonus_percent
                - discount_percent
                - bonus_balance
                - bonus_out_percent
                - program_name
                - program_type
                - max_bill_bonus_out
                - max_bonus_out
                - only_with_cards
                - use_sms_code
                - use_discount_sms
                - sms_code_sum
                - card_id
                - card_state
                - card_code
                - card_barcode
                - phone
                - birth_date
                - first_name
                - middle_name
                - last_name
                - full_name
                - sex
                - client_email
                - discounted_total
                - discount
                - activate_client_type
                - replace_card_type
                - referral_system_is_used
                - purchases_sum
                - status_name
                - next_period_status_name
                - next_status_name
                - next_status_purchases_sum
                - next_status_bonus_percent
                - next_status_discount_percent
                - progressive_scale_type
                - sum_to_next_status
                - phone_is_free
                - outer_systems_interface_type
                - special_days_types
                - not_to_send_sms
                - not_to_send_email
                - tags
                - top_sales
                - program_write_off_type
                - allow_manual_card_spend
                type: object
                properties:
                  result_code:
                    type:
                    - string
                    - integer
                    format: int
                    description: код результата, где 0 - успешно
                    example: '0'
                  result_text:
                    type: string
                    description: Текст результата
                    example: Клиент найден
                  client_id:
                    type:
                    - string
                    - 'null'
                    format: int
                    description: id клиента, null если не найден
                    example: '4004565'
                  state:
                    type:
                    - string
                    - 'null'
                    format: int
                    enum:
                    - 'null'
                    - '0'
                    - '1'
                    - '2'
                    - '3'
                    - '4'
                    description: "состояние клиента \n\n- NULL - не найден\n- 0 –\
                      \ пустой\n- 1 – активирован\n- 2 – заблокирован\n- 3 - зарегистрирован\n\
                      - 4 - замена карты (донор)\n"
                    example: '1'
                  bonus_percent:
                    type:
                    - string
                    - 'null'
                    format: double
                    description: процент начисления бонусов клиента с учётом всех
                      факторов, null если клиент не найден
                    example: '10.00'
                  discount_percent:
                    type:
                    - string
                    - 'null'
                    format: double
                    description: дисконтный процент клиента с учётом всех факторов,
                      null если клиент не найден
                    example: '0.00'
                  bonus_balance:
                    type: number
                    format: double
                    description: количество бонусов у клиента
                    example: 323.15
                  bonus_out_percent:
                    type:
                    - string
                    - 'null'
                    format: double
                    description: максимальный процент оплаты бонусами по программе
                      лояльности с учетом прогрессивной шкалы, null если клиент не
                      найден
                    example: '100'
                  program_name:
                    type:
                    - string
                    - 'null'
                    description: название программы лояльности, null если клиент
                      не найден
                    example: Бонусная 10%
                  program_type:
                    type:
                    - string
                    - 'null'
                    format: int
                    enum:
                    - 'null'
                    - '0'
                    - '1'
                    - '2'
                    - '3'
                    description: "тип программы лояльности, null если клиент не найден\
                      \ \n\n- 0 - бонусная\n- 1\
                      \ - дисконтная\n- 2 - дисконтно-бонусная\n- 3 - подарочный сертификат\n"
                    example: '0'
                  max_bill_bonus_out:
                    type:
                    - string
                    - integer
                    format: double
                    description: максимальная сумма списания на текущий чек без учета
                      баланса клиента, параметр нужен для дальнейшего использования
                      в processsale
                    example: '328.30'
                  max_bonus_out:
                    type:
                    - string
                    - integer
                    format: double
                    description: максимальная сумма списания с учетом баланса клиента,
                      позволяем ввести для списания не больше этого значения для документа
                    example: '323.16'
                  only_with_cards:
                    type: string
                    format: int
                    enum:
                    - '0'
                    - '1'
                    description: обязательно ли должна быть карта у клиента, 1 - обязательно
                    example: '0'
                  use_sms_code:
                    type: string
                    format: int
                    enum:
                    - '0'
                    - '1'
                    - '2'
                    description: "используются ли коды для подтверждения операций\
                      \ списания бонусов \n\n- 0 - нет\n- 1 - при вводе телефона\n\
                      - 2 - при вводе карты и телефона\n"
                    example: '0'
                  use_discount_sms:
                    type: string
                    format: int
                    enum:
                    - '0'
                    - '1'
                    - '2'
                    description: "используются ли коды для подтверждения операций\
                      \ по дисконтной программе лояльности \n\n- 0 - нет\n- 1 - при\
                      \ вводе телефона\n- 2 - при вводе карты и телефона\n"
                    example: '0'
                  sms_code_sum:
                    type: number
                    format: double
                    description: минимальная сумма списания, при которой надо запрашивать
                      код подтверждения операции
                    example: '0'
                  card_id:
                    type:
                    - string
                    - 'null'
                    format: int
                    description: id карты клиента в лояльности, null если нет
                    example: '3968102'
                  card_state:
                    type:
                    - string
                    - 'null'
                    format: int
                    enum:
                    - 'null'
                    - '0'
                    - '2'
                    - '3'
                    description: 'состояние карты клиента, при поиске по карте - отображается
                      та карта по которой искали, при другом варианте поиска всегда
                      пластиковая карта, null если нет


                      - 0 - рабочая

                      - 2 - заблокирована

                      - 3 - заменена

                      '
                    example: 0
                  card_code:
                    type:
                    - string
                    - 'null'
                    description: номер карты, null если нет
                    example: '200082'
                  card_barcode:
                    type:
                    - string
                    - 'null'
                    description: внутренний номер карты, null если нет
                    example: '9990012000826'
                  phone:
                    type:
                    - string
                    - 'null'
                    format: phone
                    description: номер телефона клиента, null если не заполнено
                    example: '79129999999'
                  birth_date:
                    type:
                    - string
                    - 'null'
                    format: date
                    description: дата рождения клиента, null если не заполнено
                    example: '1997-10-02'
                  first_name:
                    type:
                    - string
                    - 'null'
                    description: имя клиента, null если не заполнено
                    example: Иван
                  middle_name:
                    type:
                    - string
                    - 'null'
                    description: отчество клиента, null если не заполнено
                    example: Иванович
                  last_name:
                    type:
                    - string
                    - 'null'
                    description: фамилия клиента, null если не заполнено
                    example: Иванов
                  full_name:
                    type: string
                    description: полное ФИО клиента
                    example: Иванов Иван Иванович
                  sex:
                    type:
                    - string
                    - 'null'
                    format: int
                    enum:
                    - 'null'
                    - '0'
                    - '1'
                    description: 'пол клиента, null если не заполнено


                      - 0 - женский

                      - 1 - мужской

                      '
                    example: 1
                  client_email:
                    type:
                    - string
                    - 'null'
                    format: email
                    description: адрес электронной почты, null если клиент не найден
                      или не заполнен
                    example: example@email.ru
                  discounted_total:
                    type:
                    - string
                    - integer
                    format: double
                    description: сумма чека со скидками
                    example: '328.30'
                  discount:
                    type:
                    - string
                    - integer
                    format: double
                    description: сумма скидки по документу
                    example: '0.00'
                  activate_client_type:
                    type: string
                    format: int
                    enum:
                    - '0'
                    - '1'
                    - '2'
                    description: "тип активации клиента на кассе \n\n- 0 - без кода\
                      \ подтверждения\n- 1 - по коду подтверждения\n- 2 - запрещена\n"
                    example: '1'
                  replace_card_type:
                    type: string
                    format: int
                    enum:
                    - '0'
                    - '1'
                    - '2'
                    description: "тип замены карты на кассе \n\n- 0 - без кода подтверждения\n\
                      - 1 - по коду подтверждения\n- 2 - запрещена\n"
                    example: '1'
                  referral_system_is_used:
                    type: string
                    format: int
                    enum:
                    - '0'
                    - '1'
                    description: "используется ли реферальная система \n\n- 0 - нет\n\
                      - 1 - да\n"
                    example: '0'
                  purchases_sum:
                    type:
                    - string
                    - integer
                    format: double
                    description: сумма покупок клиента за всё время
                    example: '14841.24'
                  status_name:
                    type:
                    - string
                    - 'null'
                    description: наименование статуса текущего периода по прогрессивной
                      шкале, null если нет
                    example: Серебро
                  next_period_status_name:
                    type:
                    - string
                    - 'null'
                    description: накопленный статус следующего периода, null если
                      нет
                    example: нет
                  next_status_name:
                    type:
                    - string
                    - 'null'
                    description: следующий статус, null если нет
                    example: Золото
                  next_status_purchases_sum:
                    type:
                    - string
                    - 'null'
                    format: double
                    description: сумма покупок, которую нужно совершить в текущем
                      периоде для получения следующего статуса периода, null если
                      нет
                    example: '50000.00'
                  next_status_bonus_percent:
                    type:
                    - string
                    - 'null'
                    format: double
                    description: бонусный процент в следующем статусе прогрессивной
                      шкалы, null если нет
                    example: '15'
                  next_status_discount_percent:
                    type:
                    - string
                    - 'null'
                    format: double
                    description: дисконтный процент в следующем статусе прогрессивной
                      шкалы, null если нет
                    example: '0'
                  progressive_scale_type:
                    type:
                    - integer
                    - 'null'
                    format: int
                    enum:
                    - null
                    - 0
                    - 1
                    description: 'тип прогрессивной шкалы


                      - null - нет прогрессивной шкалы

                      - 0 - шкала за все время

                      - 1 - шкала за месяц

                      '
                    example: 0
                  sum_to_next_status:
                    type:
                    - string
                    - 'null'
                    format: double
                    description: сумма покупок, которую осталось совершить до достижения
                      суммы next_status_purchases_sum
                    example: '35158.76'
                  phone_is_free:
                    type:
                    - string
                    - 'null'
                    format: int
                    enum:
                    - 'null'
                    - '0'
                    - '1'
                    description: 'при поиске по номеру телефона: 1 - телефона свободен,
                      0 - телефон занят, при поиске по другим реквизитам значение
                      равно null'
                    example: 0
                  outer_systems_interface_type:
                    type:
                    - integer
                    - 'null'
                    format: int
                    enum:
                    - null
                    - 4
                    - 5
                    - 10
                    description: 'тип интерфейса карты. Без этого параметра
                            вернутся все действующие карты клиента


                            - null - пластиковая

                            - 4 - CardsMobile (Кошелёк)

                            - 5 - Custom application (Внешнее приложение)

                            - 10 - Виртуальная карта

                            '
                  special_days_types:
                    type:
                    - array
                    - 'null'
                    description: массив специальных дат, доступных для программы лояльности
                      покупателя, null если нет
                    items:
                      required:
                      - id
                      - aname
                      - value
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int
                          description: id специальной даты в лояльности, может использоваться
                            в addclient
                        aname:
                          type: string
                          description: наименование особой даты
                        value:
                          type:
                          - string
                          - 'null'
                          format: date
                          description: текущее значение особой даты у клиента, null
                            если нет
                    example:
                    - id: 90
                      aname: День свадьбы
                      value: '2017-07-07'
                    - id: 265
                      aname: День рождение ребёнка
                      value: null
                  not_to_send_sms:
                    type:
                    - integer
                    - 'null'
                    format: int
                    enum:
                    - null
                    - 0
                    - 1
                    description: не отправлять рекламные смс (1 - не отправлять),
                      null если клиент не найден
                    example: 0
                  not_to_send_email:
                    type:
                    - integer
                    - 'null'
                    format: int
                    enum:
                    - null
                    - 0
                    - 1
                    description: не отправлять рекламные e-mail (1 - не отправлять),
                      null если клиент не найден
                    example: 0
                  tags:
                    type:
                    - array
                    - 'null'
                    description: массив с тегами клиента, null если нет
                    items:
                      type: string
                    example:
                    - VIP
                    - подарок
                  top_sales:
                    type:
                    - array
                    - 'null'
                    description: любимые покупки клиента, null если нет
                    items:
                      type: string
                    example:
                    - Товар 3
                    - Товар 2
                  program_write_off_type:
                    type:
                    - string
                    - 'null'
                    format: int
                    enum:
                    - null
                    - '0'
                    - '1'
                    description: тип оплаты подарочным сертификатом (0 - Скидкой,
                      1 - Оплатой)
                    example: null
                  allow_manual_card_spend:
                    type: integer
                    format: int
                    enum:
                    - 0
                    - 1
                    description: настройка списание по ручному вводу карты разрешено,
                      1 - разрешено
                    example: 0
                  _bill_data:
                    required:
                    - items
                    type: object
                    description: используется для предварительного расчета по акциям
                      на применение цены, если на кассе используются внутренние скидки,
                      так как внутренняя скидка кассы может изменится после применения
                      цены делается промежуточный расчет в searchclient или можно
                      так же сделать в processsale, по итогам применяются цены из
                      ответа, и в дальнейшем в processsale на позицию передаются данные
                      о применённых уже акциях, для исключения повторного применения
                    properties:
                      items:
                        type:
                        - array
                        - 'null'
                        description: массив объектов с акциями на применение цены,
                          при использовании скидки на кассе требуется передать входной
                          параметр **pos_discounts_are_used true**, тогда массив будет
                          заполнен
                        items:
                          required:
                          - code
                          - flags
                          - price
                          - new_price_action_id
                          - new_price_respond_id
                          - new_price_limit_action_id
                          - new_price_limit_respond_id
                          - new_price_limits_counter_quantity
                          type: object
                          properties:
                            code:
                              type: string
                              description: код номенклатуры
                            flags:
                              type: integer
                              format: int
                              description: флаг информирования кассира об изменении
                                цены
                            price:
                              type: number
                              format: double
                              description: цена номенклатуры, необходимо самостоятельно
                                сравнить с исходящей, в случае изменения применить
                            new_price_action_id:
                              type:
                              - integer
                              - 'null'
                              format: int
                              description: id акции в лояльности
                            new_price_respond_id:
                              type:
                              - integer
                              - 'null'
                              format: int
                              description: id действия акции в лояльности
                            new_price_limit_action_id:
                              type:
                              - integer
                              - 'null'
                              format: int
                              description: id акции ограничения в лояльности
                            new_price_limit_respond_id:
                              type:
                              - integer
                              - 'null'
                              format: int
                              description: id действия акции по ограничению в лояльности
                            new_price_limits_counter_quantity:
                              type:
                              - integer
                              - 'null'
                              format: int
                              description: остаток для накопления сработки акции
                        example:
                        - code: '2137'
                          flags: 0
                          price: 130
                          new_price_action_id: null
                          new_price_respond_id: null
                          new_price_limit_action_id: null
                          new_price_limit_respond_id: null
                          new_price_limits_counter_quantity: null
                        - code: '3957'
                          flags: 1
                          price: 59
                          new_price_action_id: 32243
                          new_price_respond_id: 138499
                          new_price_limit_action_id: null
                          new_price_limit_respond_id: null
                          new_price_limits_counter_quantity: null
                  cards:
                    type: array
                    description: параметр будет если передать входной параметр full_data
                      со значением true. Массив всех карт клиента
                    items:
                      required:
                      - code
                      - barcode
                      - card_id
                      - outer_systems_interface_name
                      - outer_systems_interface_type
                      type: object
                      properties:
                        code:
                          type: string
                          description: номер карты
                        barcode:
                          type: string
                          description: barcode карты
                        card_id:
                          type: integer
                          format: int
                          description: id карты в лояльности
                        outer_systems_interface_name:
                          type: string
                          description: название интерфейса карты
                        outer_systems_interface_type:
                          type:
                          - integer
                          - 'null'
                          format: int
                          enum:
                          - null
                          - 4
                          - 5
                          - 10
                          description: 'тип интерфейса карты. Без этого параметра
                            вернутся все действующие карты клиента


                            - null - пластиковая

                            - 4 - CardsMobile (Кошелёк)

                            - 5 - Custom application (Внешнее приложение)

                            - 10 - Виртуальная карта

                            '
                    example:
                    - code: '0061'
                      barcode: '300061'
                      card_id: 10963328
                      outer_systems_interface_name: null
                      outer_systems_interface_type: null
                  interfaces:
                    type: array
                    description: параметр будет если передать входной параметр full_data
                      со значением true. Массив всех интерфейсов клиента
                    items:
                      required:
                      - interface_id
                      - interface_os
                      - interface_name
                      - interface_type
                      type: object
                      properties:
                        interface_id:
                          type:
                          - string
                          - 'null'
                          description: уникальный идентификатор интерфейса, null если
                            нет
                        interface_os:
                          type:
                          - string
                          - 'null'
                          description: имя операционной системы, null если нет
                        interface_name:
                          type: string
                          description: имя интерфейса
                        interface_type:
                          type: integer
                          format: int
                          enum:
                          - 0
                          - 3
                          - 4
                          description: тип интерфейса (0 - Telegram, 3 - Mobile App,
                            4 - Wallet)
                    example:
                    - interface_id: '1234567890'
                      interface_os: ''
                      interface_name: Telegram
                      interface_type: 0
        '403':
          description: 403 Forbidden - доступ запрещен, может содержать тело
          content:
            application/json:
              schema:
                type: object
                properties:
                  result_code:
                    type: integer
                    example: 1
                  result_text:
                    type: string
                    example: Доступ запрещен
  /load/addclient:
    post:
      operationId: addclient
      summary: Добавление/обновление клиента
      description: Если id клиента задан, то обновляется информация о клиенте, если
        нет, то клиент создается и активируется
      tags:
      - Клиенты
      requestBody:
        content:
          application/json:
            schema:
              required:
              - client_id
              - phone
              type: object
              properties:
                client_id:
                  type:
                  - integer
                  - 'null'
                  format: int
                  description: id клиента в лояльности. Для нового клиента создаваемого
                    по номеру телефона укажите значение "null"
                  example: 4004565
                phone:
                  type: string
                  format: phone
                  description: номер телефона клиента 11 символов, первая 7
                  example: '79129999999'
                first_name:
                  type: string
                  description: имя клиента
                  example: Дарья
                middle_name:
                  type: string
                  description: отчество клиента
                  example: Владимировна
                last_name:
                  type: string
                  description: фамилия клиента
                  example: Петрова
                birth_date:
                  type: string
                  format: data
                  description: дата рождения клиента
                  example: 02.10.1997
                sex:
                  type: integer
                  format: int
                  enum:
                  - 0
                  - 1
                  description: 'пол клиента


                    - 0 - женский

                    - 1 - мужской

                    '
                  example: 0
                email:
                  type: string
                  format: email
                  description: адрес электронной почты
                  example: ex@example.ru
                shift_open_dt:
                  type: string
                  format: date time
                  description: дата и время открытия кассовой смены
                  example: 09.11.20 08:01:44
                special_days:
                  type: array
                  description: массив специальных дат, id специальных дат нужно брать
                    из ответа функции searchclient параметр special_days_types
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                        format: int
                        description: id специальной даты
                        example: 90
                      value:
                        type: string
                        format: date
                        description: значение специальной даты
                        example: 07.07.2017
                promo_code:
                  type: string
                  description: промокод для акций
                  example: promo2023
                not_to_send_sms:
                  type: integer
                  format: int
                  enum:
                  - 0
                  - 1
                  description: "не отправлять информационных смс \n\n- 0 - отправлять\n\
                    - 1 - не отправлять\n"
                  example: 0
                not_to_send_email:
                  type: integer
                  format: int
                  enum:
                  - 0
                  - 1
                  description: "не отправлять информационных смс \n\n- 0 - отправлять\n\
                    - 1 - не отправлять\n"
                  example: 0
                referrer_client_id:
                  type: integer
                  format: int
                  description: id клиента издателя (кто рекомендовал)
                  example: 123456
                outer_systems_interface_type:
                  type: integer
                  format: int
                  enum:
                  - 4
                  - 5
                  description: "тип интерфейса внешней системы \n\n- 4 - CardsMobile (Кошелёк)\n\
                    - 5 - Custom application (Внешнее приложение)\n"
                card_code:
                  type: string
                  description: короткий номер карты, который нужно создать (уникальное
                    поле, коды не могут быть одинаковыми)
                card_barcode:
                  type: string
                  description: номер карты (barcode), для создаваемой карты
      responses:
        '200':
          description: Описание возвращаемого результата
          content:
            application/json:
              schema:
                required:
                - client_id
                - result_code
                - result_text
                type: object
                properties:
                  success:
                    type: integer
                    format: int
                    description: код выполнения
                    example: 1
                  client_id:
                    type: integer
                    format: int
                    description: id клиента в лояльности
                    example: 4004565
                  result_code:
                    type:
                    - string
                    - integer
                    format: int
                    description: код результата, где 0 - успешно
                    example: '0'
                  result_text:
                    type: string
                    description: текст описания результата
                    example: Данные клиента изменены
        '403':
          description: 403 Forbidden - доступ запрещен, может содержать тело
          content:
            application/json:
              schema:
                type: object
                properties:
                  result_code:
                    type: integer
                    example: 1
                  result_text:
                    type: string
                    example: Доступ запрещен

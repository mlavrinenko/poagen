  /load/getdetailingbymove:
    post:
      operationId: getdetailingbymove
      summary: Детализация операции
      description: Получение детальной информации по операции. Что бы получить информацию
        по операции необходимо обязательно передать **id** или **move_id**, при этом
        если есть несколько документов с одинаковым **move_id** в базе с разных касс
        то вернется последний, для того что бы уточнить какой документ нужно передать
        **move_date**, который для не подтвержденного документа является датой открытия
        документа (**doc_open_dt** из **processsale**), а для подтвержденного датой
        закрытия документа (**doc_dt** из **confirmsale**)
      tags:
      - Операции
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  format: int
                  description: id операции в лояльности, можно использовать только
                    этот номер без дополнительных параметров, если он известен
                  example: 155912975
                move_id:
                  type: string
                  description: внешний номер операции, присланный с кассы, можно использовать
                    вместо **id**, если он не известен
                  example: frl-050422-180306-79365
                move_date:
                  type: string
                  description: дата операции, для не подтверждённой операции **doc_open_dt**
                    из **processsale**, для подтвержденной **doc_dt** из **confirmsale**
                  example: 05.04.2022 18:03:43
      responses:
        '200':
          description: Описание возвращаемого результата
          content:
            application/json:
              schema:
                required:
                - result_code
                - result_text
                type: object
                properties:
                  result_code:
                    type:
                    - string
                    - integer
                    format: int
                    description: код результата, где 0 - успешно
                    example: '0'
                  result_text:
                    type: string
                    description: текст описания результата
                    example: текст результата
                  move_info:
                    type: object
                    description: общая информация по операции
                    properties:
                      id:
                        type: integer
                        format: int
                        description: id операции в лояльности
                        example: 155912975
                      move_id:
                        type:
                        - string
                        - 'null'
                        description: внешний номер операции, присланный с кассы, null
                          если нет
                        example: frl-050422-180306-79365
                      bonus_in:
                        type: number
                        format: double
                        description: количество начисленных бонусов в операции
                        example: 218.85
                      discount:
                        type: number
                        format: double
                        description: сумма скидки в операции
                        example: 50
                      bonus_out:
                        type: number
                        format: double
                        description: количество списанных бонусов в операции
                        example: 0
                      client_id:
                        type:
                        - integer
                        - 'null'
                        format: int
                        description: id клиента в лояльности, null если без клиента
                        example: 4004565
                      move_asum:
                        type: number
                        format: double
                        description: итоговая сумма операции
                        example: 2188.4
                      move_date:
                        type: string
                        format: date time
                        description: дата и время операции, для не подтверждённой
                          операции **doc_open_dt** из **processsale**, для подтвержденной
                          **doc_dt** из **confirmsale**
                        example: 05.04.2022 18:03:43
                      oper_type:
                        type: integer
                        format: int
                        enum:
                        - 0
                        - 1
                        - 2
                        - 3
                        description: "тип операции \n\n- 0 - продажа\n- 1 - возврат\n\
                          - 2 - автоматическая операция\n- 3 - ручная операция)\n"
                        example: 0
                      move_total:
                        type: number
                        format: double
                        description: сумма операции без скидок и списания бонусов
                        example: 2238.4
                      is_reserved:
                        type: boolean
                        description: флаг резервирования операции, **true** - зарезервирована,
                          **false** - не зарезервирована
                        example: false
                      promo_codes:
                        type: array
                        description: массив примененных к операции промокодов
                        items:
                          type: string
                          example: '20220224001'
                      is_confirmed:
                        type: boolean
                        description: флаг подтвержденной операции, **true** - подтверждена,
                          **false** - не подтверждена
                        example: true
                      move_actions:
                        type:
                        - array
                        - 'null'
                        description: массив акций, применённых на документ (не включает
                          в себя акции с бонусными подарками), null если нет
                        items:
                          type: object
                          properties:
                            action_id:
                              type: integer
                              format: int
                              description: id акции в лояльности
                              example: 123
                            action_name:
                              type: string
                              description: наименование акции
                              example: Название акции
                      shift_number:
                        type: integer
                        format: int
                        description: номер смены операции
                        example: 552
                      cash_discount:
                        type: number
                        format: double
                        description: сумма скидки операции, применённая кассовым ПО
                          или интернет магазином на этапе расчета
                        example: 0
                      bonus_presents:
                        type:
                        - array
                        - 'null'
                        description: массив бонусных подарков на операцию, null если
                          нет
                        items:
                          type: object
                          properties:
                            bonus_in:
                              type: number

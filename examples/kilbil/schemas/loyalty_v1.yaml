  /load/askconfirmphone:
    post:
      operationId: askconfirmphone
      summary: Отправить код подтверждения
      description: Отправляется код подтверждения клиенту
      tags:
      - Код подтверждения
      requestBody:
        content:
          application/json:
            schema:
              required:
              - client_id
              - phone
              type: object
              properties:
                client_id:
                  type:

                  - 'null'
                  format: int
                  description: id клиента в лояльности
                  example: 4004565
                phone:
                  type: string
                  format: phone
                  description: номер телефона клиента 11 символов, первая 7
                  example: '79129999999'
                sms_type:
                  type: integer
                  format: int
                  default: 1
                  enum:
                  - 0
                  - 1
                  description: "тип шаблона сообщения \n\n- 0 - сообщение с пин-кодом\
                    \ подтверждения для регистрации клиента\n- 1 - сообщение с пин-кодом,\
                    \ например для списания бонусов\n"
                  example: 1
                send_type:
                  type: integer
                  format: int
                  enum:
                  - 0
                  - 1
                  description: 'указывается в случае принудительной отправки нужного
                    типа, если не передано то решается лояльностью


                    - 0 - СМС

                    - 1 - звонком


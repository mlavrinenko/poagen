                      align: c
                    - text: 'Бонусов списано: 100.00'
                      align: l
                    - text: 'Бонусов начислено: 9.15'
                      align: l
                    - text: 'Текущий баланс: 232.31'
                      align: l
                  _bill_header:
                    type:

openapi: 3.0.3
info:
  title: Inline Payload Multi-Status Fixture
  version: "1.0.0"
  description: >
    name-inline-schemas-by-operation-and-status fixture. One operation
    declares three inline object responses: the `200` that drives the return
    type, a `403`, and a `default` — every status besides the picked one
    still earns its own class, unwired from the return type until
    typed-error-responses lands.
paths:
  /widgets/{id}:
    get:
      operationId: getWidget
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: found
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                properties:
                  id:
                    type: string
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                type: object
                required:
                  - reason
                properties:
                  reason:
                    type: string
        default:
          description: anything else
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string

openapi: 3.0.3
info:
  title: Inline Payload Multi-Status Fixture
  version: "1.0.0"
  description: >
    name-inline-schemas-by-operation-and-status fixture, extended by
    typed-error-responses to also cover OpenAPI's exact/range/default
    precedence: one operation declares four inline object responses — the
    `200` that drives the return type, an exact `403`, a `4XX` range key
    that the exact `403` must still win over on the wire, and a `default`.
    Every status earns its own class, and every one of them now wires into
    the operation's envelope.
paths:
  /widgets/{id}:
    get:
      operationId: getWidget
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: found
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                properties:
                  id:
                    type: string
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                type: object
                required:
                  - reason
                properties:
                  reason:
                    type: string
        '4XX':
          description: any other client error
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                properties:
                  code:
                    type: integer
        default:
          description: anything else
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string

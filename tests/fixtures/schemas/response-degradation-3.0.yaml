openapi: 3.0.3
info:
  title: Response Degradation Fixture
  version: "1.0.0"
  description: >
    default-deny-on-degradation: every 2xx response shape the generator
    cannot represent as a typed return must refuse the run rather than
    fall back to `void` and silently throw the vendor's body away. Each
    operation here is independently unrepresentable for a different
    reason; `okOperation` is fully representable and proves a Profile::$skip
    entry only affects what it names.

    `getXmlLabel` is xml-response-outcome's fixture: neither kilbil nor
    petstore declares an application/xml response, so nothing in the
    committed corpora exercises this path without it. See
    xml-responses-refused-at-generation-time — an application/xml response
    refuses without being decoded or special-cased, and it is now the only
    non-application/json content type that does so on grounds of its type
    alone.

    `getPlainText` was one of the unrepresentable four until
    represent-non-json-request-and-response-bodies: a `text/*` response over
    a `type: string` schema is the string the document declared, so it is
    kept here on the representable side, as the guard against that refusal
    coming back. `getBinaryBlob` took its place in the count — a
    `format: binary` body is a stream, and the return contract cannot name
    one yet.

    `listInlineItems` declared `items: {type: string}` until
    a-response-of-scalars-has-no-return-shape made exactly that shape
    representable. It now declares `items: {}` — nothing at all — because
    what this fixture needs from it is an array item the generator genuinely
    cannot type, and a list of mixed is the widening
    declared-shapes-become-types refuses.
paths:
  /plain-text:
    get:
      operationId: getPlainText
      responses:
        '200':
          description: ok
          content:
            text/plain:
              schema:
                type: string
  /binary-blob:
    get:
      operationId: getBinaryBlob
      responses:
        '200':
          description: ok
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /xml-label:
    get:
      operationId: getXmlLabel
      responses:
        '200':
          description: ok
          content:
            application/xml:
              schema:
                type: string
  /broken-ref:
    get:
      operationId: getBrokenRef
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/'
  /inline-array:
    get:
      operationId: listInlineItems
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: {}
  /ok:
    get:
      operationId: okOperation
      responses:
        '204':
          description: ok

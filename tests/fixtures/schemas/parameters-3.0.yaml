openapi: 3.0.3
info:
  title: Parameters Fixture
  version: 1.0.0
  description: >
    Exercises $ref-to-Parameter resolution (task 005) and PathItem-level
    parameter inheritance (task 006) in isolation from the Petstore
    golden tree.
servers:
  - url: https://parameters.example/api/v1

security:
  - apiKey: []

paths:
  /pet/{petId}:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      operationId: getPetById
      security: []
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'

  /order:
    get:
      operationId: listOrders
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/ApiKey'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
    post:
      operationId: placeOrder
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/CreateOrder'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /proxy:
    post:
      # The dot in the raw operationId mirrors the DigitalOcean
      # `monitoring_get_appRestartCountMetrics.yml` shape — both the
      # method name and the kebab-case header parameter must be
      # normalised to PHP identifiers without losing the wire keys.
      operationId: monitoring_get_foo.yml
      security: []
      parameters:
        - name: Content-Type
          in: header
          required: false
          schema:
            type: string
        - name: X-Trace-ID
          in: header
          required: false
          schema:
            type: string
      responses:
        '204':
          description: ok

  /inline-body:
    post:
      # Used by the skip-diagnostic scenario: the requestBody schema is
      # an inline object rather than a $ref-to-Model. The generator does
      # not (yet) synthesise an anonymous Model for inline bodies, so
      # the operation is skipped — but the skip must be reported instead
      # of being dropped silently.
      operationId: postInlineBody
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '204':
          description: ok

  /token:
    post:
      operationId: issueToken
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - grantType
                - clientId
              properties:
                grantType:
                  type: string
                clientId:
                  type: string
                scope:
                  type: string
      responses:
        '204':
          description: ok

  /store/{storeId}/items:
    parameters:
      - name: storeId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: listStoreItems
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
    delete:
      operationId: clearStore
      responses:
        '204':
          description: cleared

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
    bearerAuth:
      type: http
      scheme: bearer
  requestBodies:
    CreateOrder:
      description: order to place
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Order'
  parameters:
    PetId:
      name: petId
      in: path
      required: true
      schema:
        type: integer
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
    ApiKey:
      name: api_key
      in: header
      required: false
      schema:
        type: string
  schemas:
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
        name:
          type: string
    Order:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
        status:
          $ref: '#/components/schemas/Status'
    Status:
      type: string
      enum:
        - placed
        - approved
        - delivered

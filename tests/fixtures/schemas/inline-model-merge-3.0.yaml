info:
  title: Inline Model Merge Fixture
  version: "1.0.0"
  description: >
    name-inline-schemas-by-operation-and-status fixture. getA, getB and getC
    each declare a 200 response with the identical inline shape — the group a
    Profile::$inlineModels merge entry can legitimately collapse into one
    class. getD's 200 response looks similar but its `code` property is a
    different type, so merging it with the others must fail naming the two
    sites and the property. postE and postF declare identical inline request
    bodies, so the same merge works on the request side too.
paths:
  /a:
    get:
      operationId: getA
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [code, message]
                properties:
                  code:
                    type: integer
                  message:
                    type: string

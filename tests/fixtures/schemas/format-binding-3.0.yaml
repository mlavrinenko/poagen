openapi: 3.0.3
info:
  title: Format binding (synthetic)
  version: "1.0.0"
  description: >-
    Tiny fixture used to exercise Profile::$formats — a binding declared once
    in the profile and applied wherever its format appears. `uuid` covers a
    required property, an optional one, a list of them, a second component and
    a path parameter, so a document-wide binding has five distinct sites to
    reach — the list is what proves a codec-bound format threads through into
    a `list<T>` item, not only a bare scalar property.
    `binary` and `email` are here as controls: neither is bound by the golden
    profile, and `binary` on a plain property is the case poagen deliberately
    leaves as a bare string. `avatarBytes` (`format: byte`) is bound with no
    profile entry at all — `base64-binding-for-format-byte`'s whole point —
    so the golden shows a built-in codec sitting next to a profile-selected
    one and an unbound control.
paths:
  /accounts/{accountId}:
    get:
      operationId: getAccount
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
  /sessions:
    post:
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Session'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
components:
  schemas:
    Account:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        previousIds:
          type: array
          items:
            type: string
            format: uuid
        avatar:
          type: string
          format: binary
        avatarBytes:
          type: string
          format: byte
        contact:
          type: string
          format: email
    Session:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

openapi: 3.1.0
info:
  title: Type List Fixture
  version: "1.0.0"
  description: >
    nullable-type-arrays fixture. Writes `type` as a list rather than a string,
    which is how JSON Schema and OpenAPI 3.1 say "nullable". Between them the
    operations cover the three readings: one member plus "null", several scalar
    members, and a list mixing a non-scalar with something else — which is the
    one paogen refuses.
paths:
  /nullable:
    post:
      operationId: nullableShapes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - requiredButNullable
              properties:
                requiredButNullable:
                  type:
                    - integer
                    - "null"
                optionalNullableString:
                  type:
                    - string
                    - "null"
                nullableList:
                  type:
                    - array
                    - "null"
                  items:
                    type: string
                singleMemberList:
                  type:
                    - string
                nullableEnum:
                  type:
                    - string
                    - "null"
                  enum:
                    - draft
                    - live
                scalarUnion:
                  type:
                    - string
                    - integer
                untyped:
                  description: the document says nothing about this one
      responses:
        '204':
          description: ok
  /refused:
    post:
      operationId: refusedShapes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - eitherObjectOrString
              properties:
                eitherObjectOrString:
                  type:
                    - object
                    - string
                  properties:
                    inner:
                      type: string
      responses:
        '204':
          description: ok

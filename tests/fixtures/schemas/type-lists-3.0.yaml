openapi: 3.1.0
info:
  title: Type List Fixture
  version: "1.0.0"
  description: >
    nullable-type-arrays fixture. Writes `type` as a list rather than a string,
    which is how JSON Schema and OpenAPI 3.1 say "nullable". Between them the
    operations cover the three readings: one member plus "null", several scalar
    members, and a list mixing a non-scalar with something else — which is the
    one poagen refuses.
paths:
  /nullable:
    post:
      operationId: nullableShapes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - requiredButNullable
                - requiredNullableEnum
                - requiredNullableObject
                - requiredNullableObjectArray
                - requiredNullableTypedMap
                - requiredNullableRefUnion
                - requiredNullableComposedScalarUnion
              properties:
                requiredButNullable:
                  type:
                    - integer
                    - "null"
                requiredNullableEnum:
                  type:
                    - string
                    - "null"
                  enum:
                    - draft
                    - live
                requiredNullableObject:
                  type:
                    - object
                    - "null"
                  properties:
                    inner:
                      type: string
                requiredNullableObjectArray:
                  type:
                    - array
                    - "null"
                  items:
                    type: object
                    properties:
                      inner:
                        type: string
                optionalNullableString:
                  type:
                    - string
                    - "null"
                nullableList:
                  type:
                    - array
                    - "null"
                  items:
                    type: string
                singleMemberList:
                  type:
                    - string
                nullableEnum:
                  type:
                    - string
                    - "null"
                  enum:
                    - draft
                    - live
                scalarUnion:
                  type:
                    - string
                    - integer
                untyped:
                  description: the document says nothing about this one
                # three-more-sites-read-only-the-30-nullable-flag: each of
                # these three is required and declares nullability only
                # through the 3.1 type array, exercising a site that used to
                # read only the 3.0 flag: InlineObjectResolver::resolve()
                # (no declared properties, so it types as a map, not a
                # synthesised class), CompositionResolver::resolveUnion()
                # (a ref-only oneOf), and CompositionResolver::resolveScalarUnion()
                # (an anyOf of inline scalars).
                requiredNullableTypedMap:
                  type:
                    - object
                    - "null"
                  additionalProperties:
                    type: string
                requiredNullableRefUnion:
                  type:
                    - object
                    - "null"
                  oneOf:
                    - $ref: '#/components/schemas/NullableUnionBranchOne'
                    - $ref: '#/components/schemas/NullableUnionBranchTwo'
                requiredNullableComposedScalarUnion:
                  type:
                    - "null"
                  anyOf:
                    - type: integer
                    - type: string
      responses:
        '204':
          description: ok
  /refused:
    post:
      operationId: refusedShapes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - eitherObjectOrString
              properties:
                eitherObjectOrString:
                  type:
                    - object
                    - string
                  properties:
                    inner:
                      type: string
      responses:
        '204':
          description: ok
components:
  schemas:
    NullableUnionBranchOne:
      type: object
      required:
        - value
      properties:
        value:
          type: string
    NullableUnionBranchTwo:
      type: object
      required:
        - value
      properties:
        value:
          type: string

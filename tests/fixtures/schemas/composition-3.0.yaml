openapi: 3.0.3
info:
  title: Composition Fixture
  version: "1.0.0"
  description: >
    Exercises oneOf / anyOf / allOf handling (T-008). Minimal on purpose:
    three branches for union tests (Dog/Cat via Animal) plus a
    discriminator-bearing Pet, and an allOf merge (BaseThing + ExtraThing
    → MergedThing).
paths: {}
components:
  schemas:
    Dog:
      type: object
      required:
        - bark
      properties:
        bark:
          type: string
    Cat:
      type: object
      required:
        - meow
      properties:
        meow:
          type: string
    Animal:
      type: object
      required:
        - creature
      properties:
        creature:
          oneOf:
            - $ref: '#/components/schemas/Dog'
            - $ref: '#/components/schemas/Cat'
    Pet:
      type: object
      required:
        - kind
      properties:
        kind:
          oneOf:
            - $ref: '#/components/schemas/Dog'
            - $ref: '#/components/schemas/Cat'
          discriminator:
            propertyName: petType
    BaseThing:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
    ExtraThing:
      type: object
      required:
        - label
      properties:
        label:
          type: string
    MergedThing:
      allOf:
        - $ref: '#/components/schemas/BaseThing'
        - $ref: '#/components/schemas/ExtraThing'
    # T-026 — top-level scalar component (not an enum)
    Urn:
      type: string
      description: DigitalOcean-style urn; referenced as if it were a class.
    # T-026 — top-level type: array component
    TagsArray:
      type: array
      items:
        type: string
    # T-026 — top-level oneOf with inline object branches (titles drive the branch class names)
    FloatingIpCreate:
      oneOf:
        - title: Assign to Droplet
          type: object
          required:
            - droplet_id
          properties:
            droplet_id:
              type: integer
        - title: Reserve to Region
          type: object
          required:
            - region
          properties:
            region:
              type: string
    # T-026 — top-level anyOf with $ref branches (both ref targets implement the interface)
    LabeledIssueEvent:
      type: object
      required:
        - label
      properties:
        label:
          type: string
    UnlabeledIssueEvent:
      type: object
      required:
        - label
      properties:
        label:
          type: string
    IssueEventForIssue:
      anyOf:
        - $ref: '#/components/schemas/LabeledIssueEvent'
        - $ref: '#/components/schemas/UnlabeledIssueEvent'
    # A sibling Model that references the scalar component to exercise
    # the round-trip expectation in the T-026 scenarios.
    Resource:
      type: object
      required:
        - urn
      properties:
        urn:
          $ref: '#/components/schemas/Urn'

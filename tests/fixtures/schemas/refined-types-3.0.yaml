openapi: 3.0.3
info:
  title: Refined PHPDoc types (synthetic)
  version: "1.0.0"
  description: Fixture exercising refined-phpdoc-types — constraint-derived narrowing and the $phpDocTypes override.
paths: {}
components:
  schemas:
    Currency:
      type: string
      minLength: 3
      description: A scalar component — a property pointing here resolves to a value object, not a string.
    LineItem:
      type: object
      required:
        - sku
        - quantity
        - amount
      properties:
        sku:
          type: string
          minLength: 1
          description: A minLength >= 1 string can never arrive empty — non-empty-string.
        note:
          type: string
          description: An unconstrained string stays a bare string.
        quantity:
          type: integer
          minimum: 1
          description: An inclusive lower bound of 1 forces positive-int.
        discount:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          description: 3.0 exclusive-of-zero also forces positive-int.
        balance:
          type: integer
          minimum: 0
          description: An inclusive lower bound of 0 admits zero — stays a bare int.
        amount:
          type: string
          description: A decimal carried as a string — OpenAPI cannot say numeric-string, the profile override can.
        tags:
          type: array
          items:
            type: string
          description: A structural property — the resolver owns its PHPDoc slot, so no override can reach it.
        currency:
          $ref: '#/components/schemas/Currency'

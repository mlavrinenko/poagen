# GitHub Actions Documentation: https://docs.github.com/en/actions
#
# `runtime/.github/workflows/continuous-integration.yml` mirrors this file's
# job structure (lint / static-analysis / unit-tests / coverage), scoped to
# `runtime/` alone and dormant while it lives there — see that file's own
# comment (`bundle-the-runtime-package-with-its-own-ci-tooling`). This
# workflow already gates `runtime/src` and `runtime/tests` as part of the
# jobs below (`composer test`, `composer test:coverage`, etc. all run from
# the monorepo root, whose `phpunit.xml.dist`/`phpstan.neon.dist`/etc.
# include both trees), so nothing here needs to change for that package's
# sake — only the runtime-scoped copy needs to be kept in step if a job
# here changes shape.

name: "Continuous Integration"

on:
  push:
    branches:
      - "main"
    tags:
      - "*"
  pull_request:
    branches:
      - "main"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_ROOT_VERSION: "1.99.99"

jobs:
  lint:
    name: "Lint (cs-fixer, rector)"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - uses: "shivammathur/setup-php@v2"
        with:
          php-version: "8.4"
          coverage: "none"
      - uses: "ramsey/composer-install@v4"
      - name: "Check coding style (php-cs-fixer)"
        run: "composer lint:cs-fixer"
      - name: "Check refactorings (rector)"
        run: "composer lint:rector"

  static-analysis:
    name: "Static analysis (PHPStan)"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - uses: "shivammathur/setup-php@v2"
        with:
          php-version: "8.4"
          coverage: "none"
      - uses: "ramsey/composer-install@v4"
      - run: "composer lint:phpstan"

  unit-tests:
    name: "Unit tests"
    needs: ["lint", "static-analysis"]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4"]
        os: ["ubuntu-latest", "macos-latest"]
        composer-deps: ["lowest", "highest"]
    steps:
      - uses: "actions/checkout@v7"
      - uses: "shivammathur/setup-php@v2"
        with:
          php-version: "${{ matrix.php }}"
          coverage: "none"
      - uses: "ramsey/composer-install@v4"
        with:
          dependency-versions: "${{ matrix.composer-deps }}"
      - run: "composer test"

  docs:
    name: "Docs"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - name: "Install docs tools"
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/tola-rs/tola-ssg/releases/download/v0.7.1/tola-x86_64-linux-static.tar.gz | tar -xz -C "$HOME/.local/bin"
          curl -fsSL https://github.com/Myriad-Dreamin/tinymist/releases/download/v0.15.10/typlite-x86_64-unknown-linux-gnu.tar.gz | tar -xz --strip-components=1 -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: "bash scripts/check-docs"

  # Runs the suite once, with coverage, and enforces the per-tier floor
  # (coverage-floor-in-the-gate). Deliberately one job, not a `coverage:
  # "pcov"` leg added to the unit-tests matrix above: the floor is a
  # property of the code, not of an OS/dependency-version combination, so
  # measuring it once (ubuntu-latest, PHP 8.4, highest deps) is enough —
  # running it four more times would multiply CI cost for no additional
  # signal. `composer test:coverage` carries the floor values and the
  # instrumentation fix (see its definition in composer.json and the
  # matching `test-coverage` recipe in the Justfile for the full
  # explanation, including the ratchet-only-moves-up rule).
  coverage:
    name: "Coverage floor"
    needs: ["lint", "static-analysis"]
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - uses: "shivammathur/setup-php@v2"
        with:
          php-version: "8.4"
          coverage: "pcov"
      - uses: "ramsey/composer-install@v4"
        with:
          dependency-versions: "highest"
      - run: "composer test:coverage"

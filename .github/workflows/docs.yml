name: "Docs"

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    name: "Build docs and deploy to GitHub Pages"
    runs-on: "ubuntu-latest"
    environment:
      name: "github-pages"
      url: "${{ steps.deployment.outputs.page_url }}"
    steps:
      - uses: "actions/checkout@v7"
      - uses: "jetify-com/devbox-install-action@v0.15.0"
        with:
          enable-cache: "true"
      - name: "Build and validate docs"
        run: "devbox run -- just docs check"
      # Tola writes a CNAME from the site URL's host. A project page has no
      # custom domain, so drop it before publishing.
      - name: "Strip auto-generated CNAME"
        run: "rm -f www/public/poagen/CNAME"
      - uses: "actions/configure-pages@v6"
      - uses: "actions/upload-pages-artifact@v5"
        with:
          path: "www/public/poagen"
      - id: deployment
        uses: "actions/deploy-pages@v5"

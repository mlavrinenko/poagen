name: "Docs"

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    name: "Build docs and deploy to GitHub Pages"
    runs-on: "ubuntu-latest"
    environment:
      name: "github-pages"
      url: "${{ steps.deployment.outputs.page_url }}"
    steps:
      - uses: "actions/checkout@v7"
      - name: "Install docs tools"
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/tola-rs/tola-ssg/releases/download/v0.7.1/tola-x86_64-linux-static.tar.gz | tar -xz -C "$HOME/.local/bin"
          curl -fsSL https://github.com/Myriad-Dreamin/tinymist/releases/download/v0.15.10/typlite-x86_64-unknown-linux-gnu.tar.gz | tar -xz --strip-components=1 -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: "Build and validate docs"
        run: "bash scripts/check-docs"
      # Tola writes a CNAME from the site URL's host. A project page has no
      # custom domain, so drop it before publishing.
      - name: "Strip auto-generated CNAME"
        run: "rm -f www/public/poagen/CNAME"
      - uses: "actions/configure-pages@v6"
      - uses: "actions/upload-pages-artifact@v5"
        with:
          path: "www/public/poagen"
      - id: deployment
        uses: "actions/deploy-pages@v5"

#:schema /home/tank/projects/home/mindtape/schema/config.schema.json
# .mindtape/config.toml — the `gated` preset.
#
# For work handed to an AI coding agent. Strict, but only where the strictness
# is earned — the thresholds come from measured agent failure data, not taste.
# A disciplined human team gets the same benefit, usually at lower strictness.
#
# Four mechanisms, each aimed at a documented failure mode.
#
# Required spec sections. Across agent-authored pull requests, the ticket
# properties that moved merge rates were narrow and specific: being
# self-contained, being well-scoped, and stating expected behaviour. Piling on
# more context did not help. So this preset requires four sections and nothing
# else — the ones with evidence, gated to non-terminal tasks so a closed task
# is not held to a spec it has outgrown.
#
# No human review state. This preset shipped with one — `done` was reachable
# only from `needs-review`, on the reasoning that agents report success they
# have not achieved and rarely catch it themselves. That reasoning is sound and
# the measurement held: a fourteen-task audit of this backlog found four
# acceptance criteria out of 110 that overshot what had landed, including one
# real defect.
#
# The gate was removed anyway, on 2026-08-01, because it did not survive
# contact with throughput. Thirty-eight tasks accumulated in `needs-review`
# against a single human reviewer, and a queue nobody can service is not a gate
# — it is a queue. Every task in it was already merged and shipping; the state
# recorded an intention to review, not a review. See
# `truth/decisions/review-gate-must-be-mechanical.decision-260801.typ`.
#
# What replaces it is the `[[on.flip]]` predicate at the bottom of this file:
# the check that closes a task has to be one a machine runs, because that is the
# only kind that still runs on the thirty-eighth task.
#
# A note required on `blocked`, `failed`, and `cancelled`. An unexplained flip
# to `done` is not the only failure mode — an unexplained flip away from work
# is another, and it is the one no gate command can catch, because nothing runs
# once a task stops. `[[tasks.status]] note = "required"` demands a written
# reason exactly on those three: why it stalled, what broke, why it was
# dropped. `done` is deliberately left at the default (`note = "optional"`) —
# a note is the one thing an agent will always fill plausibly, so requiring one
# on every transition buys filler, not evidence; the `[[on.flip]]` predicate
# below is the real check there.
#
# No review comments left in the file. A human reading agent-authored work
# leaves `// no, use X instead` inline; the agent is meant to reframe the task
# and remove the note. Without a gate that conversation silently becomes the
# artifact — the objection survives into git and the next reader cannot tell a
# live one from a settled one. `policy = "forbid"` makes leaving it behind fail
# `mt check` instead of a convention nobody enforces.
#
# A machine check before a task may close. A status is a stamp, not proof, and
# the state machine alone cannot verify a completion claim — a written
# justification cannot police the thing that writes it, because a model asked to
# justify a claim predicts a plausible ending rather than checking reality. An
# external predicate can. The `[[on.flip]]` gate at the bottom of this file is
# where you point MindTape at yours.

[tasks]
[[tasks.roots]]
path = "truth/tasks"
derive-tags = true

[tasks.derive-tags]
enabled = true
collect = ["segments"]

# Every task file in this root is named `<slug>.task-<yymmdd>.typ`, and the
# sub-extension is load-bearing rather than decorative: CONTRIBUTING.md
# defines a commit's `Refs:` slug as "the filename stem without the
# `.task-<yymmdd>.typ` suffix", the commit-msg hook resolves a trailer by
# globbing `truth/tasks/<slug>.task-*.typ`, and speconaut discovers tasks by
# the same sub-extension. `mt add` does not mint it — the default stem
# template is a bare `{slug}` — so every task filed here came out as
# `<slug>.typ` and had to be renamed by hand afterwards, eight in a row on
# 2026-08-02. A file that missed the rename is not merely untidy: it is
# invisible to speconaut and unresolvable by the commit hook, so the trailer
# naming it fails the same way a missing trailer does.
#
# Pinning the template makes the convention the tool's job instead of the
# author's memory. The macros are mindtape's own (`{slug}`, `{yy}`, `{mm}`,
# `{dd}`); this is the exact shape the existing 80-odd files already carry,
# so it states what the tree says rather than introducing a convention.
[tasks.naming]
stem = "{slug}.task-{yy}{mm}{dd}"

[[tasks.status]]
value = "proposed"
glyph = "💡"
color = "blue"
to = ["accepted", "cancelled"]

[[tasks.status]]
value = "accepted"
glyph = "📋"
color = "cyan"
to = ["wip", "cancelled"]

[[tasks.status]]
value = "wip"
glyph = "🔨"
color = "yellow"
to = ["done", "blocked", "failed"]

[[tasks.status]]
value = "blocked"
glyph = "🔒"
color = "red"
# `accepted` is here because most of what blocks a task in this repo is an
# owner ruling, not a dependency — six tasks sat in `blocked` on 2026-08-02
# waiting for a decision only the owner could make. When such a ruling lands,
# the task is ready to pick up, not started: it goes back to the queue, not
# into `wip`. Without this edge the only legal moves were `wip` (which lies
# about someone working it, and burns the one-at-a-time WIP convention) and
# `--force` (which records a waiver for a transition that is entirely normal).
to = ["accepted", "wip", "cancelled", "failed"]
note = "required"

[[tasks.status]]
value = "done"
glyph = "✅"
color = "green"
terminal = true
to = ["wip"]

[[tasks.status]]
value = "cancelled"
glyph = "🚫"
color = "magenta"
terminal = true
note = "required"

[[tasks.status]]
value = "failed"
glyph = "❌"
color = "red"
terminal = true
to = ["wip"]
note = "required"

# Priority stays a plain optional integer, and no framework is configured.
# Requiring a score would buy a number the agent invented to satisfy the field:
# a model asked for a value it cannot know produces a plausible one. Fields are
# required here only where the answer is knowable in advance.
[tasks.priority]
required = false

# Difficulty is the exception, because it is the routing question: which model
# tier and reasoning effort this task wants, decided before anyone starts it.
# That is knowable in advance, unlike a priority score. Keep the number free of
# any vendor or model name — mapping it onto a model is the reader's policy.
#
# Score JUDGMENT REQUIRED, not size. A rubric both a human and an agent apply
# the same way is the difference between a routing signal and a decorative
# number; without one, a difficulty is just another invented value.
#
#   0-2  mechanical — the change is fully specified; no decision is left open.
#   3-5  local judgment — one module, one obvious approach, tests fall out of it.
#   6-8  cross-cutting design — several defensible approaches, and picking one
#        constrains later work.
#   9    the approach itself is the open question.
#
# Left optional here so the preset stays usable on an existing backlog. Set
# `required = "!terminal"` once every open task carries one — flipping it first
# fails the whole backlog at once.
[tasks.difficulty]
required = false

# A leftover review comment fails the command; see the fourth mechanism above.
[tasks.comments]
policy = "forbid"

# The required spec sections, all gated to non-terminal tasks.

# What problem, stated once, in one place.
[[tasks.body.headers.rules]]
path = ["Summary"]
action = "unique"
when = "!terminal"
message = "a task needs exactly one Summary: the problem, stated once"

# How anyone can tell it is finished. This is the single strongest predictor of
# a task an agent completes successfully.
[[tasks.body.headers.rules]]
path = ["Acceptance criteria"]
action = "unique"
when = "!terminal"
message = "a task needs Acceptance criteria — checkable conditions, not a restatement of the summary"

# What is deliberately out of scope. Agents bundle unrelated objectives into one
# change several times more often than humans do, and oversized changes are the
# ones that get rejected. Writing the boundary down is what makes drift visible.
[[tasks.body.headers.rules]]
path = ["Non-goals"]
action = "require"
when = "!terminal"
message = "a task needs Non-goals — say what it will not touch, or it will touch it"

# Which files this is expected to change. Doubles as the scope boundary you can
# actually check: compare it against `git diff --name-only` while the work runs.
[[tasks.body.headers.rules]]
path = ["Files"]
action = "require"
when = "!terminal"
message = "a task needs Files — the paths it expects to touch"

# The problem comes before the test for it.
[[tasks.body.headers.rules]]
action = "order"
before = ["Summary"]
after = ["Acceptance criteria"]
message = "Summary must precede Acceptance criteria"

# `mt ls @wip` is the work-in-progress check. Keep this at one: a change set can
# only be attributed to a task when one task is in flight.
[views.wip]
filter = "status == \"wip\""
description = "In flight — keep this list at one"

# `mt ls @recent` is what closed lately — the reading a human does instead of
# gating. Reviewing after the fact catches a wrong decision while it is still
# cheap to reverse, and it does not stall the queue when nobody reads it.
[views.recent]
filter = "status == \"done\""
sort = ["priority:desc"]
description = "Recently closed — read for decisions worth revisiting"

# Flip hooks: what happens when a task changes status. `mt flip` is the only
# command that runs these — `mt check`, `mt ls` and every other read execute
# nothing, so `mt check` stays safe inside an editor or a commit hook.
#
# Trust boundary: a command below is exactly as trusted as a Justfile recipe or
# a git hook. It comes from this repository's own config and runs with your full
# authority, from the project root. Nothing sandboxes it, and nothing pretends
# to. Read a project's config before running `mt flip` under it.

# On the way into work, print what is already in flight, so an agent picking up
# a task sees the open set rather than assuming it is alone. Nothing is
# materialised: tasks are files in git, so `mt ls` at the flipping commit
# reconstructs this list exactly.
[[on.flip]]
when = 'into("wip")'
actions = [{ list = "@wip", title = "Already in flight — finish these first:" }]

# On the way into `done`, three external checks — all gates, all stop the
# flip on a non-zero exit.
#
# The first is the preset's original floor: it refuses a task whose body
# still carries this preset's TODO placeholders, because a task nobody ever
# specified is a task nobody can have finished. On its own that only catches
# an unwritten task, not one whose work fails the project's own gate.
#
# The second is that missing check: it refuses the flip unless `just check`
# has already passed against this worktree. `mmz` (a memoized command
# runner, github:mlavrinenko/mmz — the option this comment used to point at)
# is not available in this environment: not in devbox.json, not resolvable
# on PATH. `scripts/gate-fresh` is the equivalent, built to the same rule —
# it only ever ASSERTS a prior pass; it never runs `just check` itself, so a
# flip stays fast. Its companion, `scripts/gated-check`, is what actually
# runs `just check` and records the pass `is-fresh` looks for; run it (not a
# bare `just check`) before flipping a task to `done`. See CONTRIBUTING.md.
#
# The inputs `gate-fresh` hashes are declared in scripts/gate-fresh.inputs
# and deliberately exclude `truth/tasks`: `mt flip` writes the artifact it is
# gating, so a rule keyed on the whole tree would go stale the instant a
# status is stamped and could never pass again. Whatever replaces
# `gate-fresh` here must keep that exclusion.
#
# The third is `gate-fresh is-valid`, and it exists because that exclusion
# has a hole: `truth/tasks` never invalidates the freshness hash, so a task
# artifact can go malformed — break `speconaut check truth/` — without ever
# making a recorded pass read stale. `is-valid` is a second, separate,
# stateless predicate: it re-runs `speconaut check truth/` (~1s) directly,
# every time, rather than teaching the hash to see truth/tasks (that would
# reopen the exact problem the exclusion above fixes — see
# scripts/gate-fresh.inputs). Freshness and validity stay two questions,
# both required, neither standing in for the other.
#
# It receives $MINDTAPE_TASK_FILE, $MINDTAPE_TASK_STEM and
# $MINDTAPE_TASK_STATUS, so a script can inspect the artifact being closed —
# the TODO check uses $MINDTAPE_TASK_FILE below.
#
# That check is anchored to `^- TODO: `, the exact shape the template's slot
# defaults emit, rather than matching the bare string anywhere in the file.
# Unanchored, it made any task DISCUSSING the placeholder unclosable — which
# it promptly did to `flip-gate-asserts-the-real-check`, the task that built
# this very gate, and to `speconaut-mindtape-config-skew`, whose acceptance
# criterion quotes the placeholder it is meant to test for. A gate that fires
# on a task for describing it accurately is one people learn to `--force`.
#
# `mt done --force` overrides a failing gate and records the override in the
# status note — an escape hatch that leaves a trace.
[[on.flip]]
when = 'into("done")'
actions = [
  { run = '! grep -qE "^- TODO: " "$MINDTAPE_TASK_FILE"', gate = true, message = "this task still carries the template's TODO placeholders — fill them in, or point this gate at the check that really proves the work" },
  { run = 'scripts/gate-fresh is-fresh', gate = true, message = "the project gate has not passed against this worktree since your last change — run `scripts/gated-check` (wraps `just check`) and flip again" },
  { run = 'scripts/gate-fresh is-valid', gate = true, message = "truth/ does not parse (`speconaut check truth/` failed) — a task artifact or another truth file is malformed; fix it and flip again" },
]

[ls.columns.file]
when = "true"
